<script>
 function getTeacherInitial(
    name,
    username
) {

    const words =
        String(
            name ||
            ""
        )
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .filter(
                word =>
                    ![
                        "mr",
                        "mrs",
                        "ms",
                        "pak",
                        "bu"
                    ].includes(
                        word
                            .replace(
                                /\./g,
                                ""
                            )
                            .toLowerCase()
                    )
            );


    const source =
        words.join(" ") ||
        String(
            username ||
            "A"
        );


    return (
        source
            .trim()
            .charAt(0) ||
        "A"
    ).toUpperCase();

}


    async function loadAdminIdentity() {

        try {

            const response =
                await fetch(
                    "/api/admin/me",
                    {
                        credentials:
                            "same-origin"
                    }
                );


            const data =
                await response
                    .json()
                    .catch(() => ({}));


            if (response.status === 401) {

                window.location.href =
                    "/admin-login.html";

                return;

            }


            if (
                !response.ok ||
                !data.success ||
                !data.admin
            ) {

                throw new Error(
                    data.message ||
                    "Identitas guru tidak dapat dimuat."
                );

            }


            const admin =
                data.admin;


            const adminName =
                String(
                    admin.name ||
                    admin.username ||
                    "Admin"
                ).trim();


            const displayRole =
                String(
                    admin.role ||
                    ""
                ).toLowerCase() ===
                "teacher"
                    ? "Teacher"
                    : "Administrator";


const initial =
    getTeacherInitial(
        adminName,
        admin.username
    );


            document.getElementById(
                "sidebarAdminName"
            ).textContent =
                adminName;


            document.getElementById(
                "sidebarAdminRole"
            ).textContent =
                displayRole;


            document.getElementById(
                "topAdminName"
            ).textContent =
                adminName;


            document.getElementById(
                "topAdminRole"
            ).textContent =
                displayRole;


            document.getElementById(
                "sidebarAdminAvatar"
            ).textContent =
                initial;


            document.getElementById(
                "topAdminAvatar"
            ).textContent =
                initial;


            localStorage.setItem(
                "adminName",
                adminName
            );


            localStorage.setItem(
                "adminRole",
                admin.role
            );


            localStorage.setItem(
                "adminUsername",
                admin.username
            );

        } catch (error) {

            console.error(
                "Gagal memuat identitas guru:",
                error
            );

        }

    }


    async function logout() {

        try {

            await fetch(
                "/api/logout",
                {
                    method:
                        "POST",

                    credentials:
                        "same-origin"
                }
            );

        } catch (error) {

            console.error(error);

        }


        localStorage.removeItem(
            "adminId"
        );

        localStorage.removeItem(
            "adminName"
        );

        localStorage.removeItem(
            "adminRole"
        );

        localStorage.removeItem(
            "adminUsername"
        );


        window.location.href =
            "/admin-login.html";

    }


    loadAdminIdentity();
</script>
