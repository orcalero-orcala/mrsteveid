<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Website Sedang Maintenance
    </title>

    <link
        rel="icon"
        type="image/png"
        href="/favicon.png"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            min-height: 100%;
            margin: 0;
        }


        body {
            min-height: 100vh;

            padding: 24px;

            display: grid;
            place-items: center;

            color: #f8fafc;
            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(37, 99, 235, 0.13),
                    transparent 38%
                ),
                #070d15;

            font-family:
                Inter,
                Arial,
                sans-serif;
        }


        .maintenance-card {
            width:
                min(
                    520px,
                    100%
                );

            padding: 34px;

            position: relative;
            overflow: hidden;

            background:
                rgba(13, 24, 38, 0.94);

            border:
                1px solid #293d55;

            border-radius: 20px;

            box-shadow:
                0 28px 80px
                rgba(0, 0, 0, 0.42);
        }


        .maintenance-card::before {
            content: "";

            position: absolute;
            inset:
                0 0 auto;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #60a5fa
                );
        }


        .maintenance-brand {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 30px;
        }


        .maintenance-brand img {
            width: 38px;
            height: 38px;

            display: block;
            object-fit: contain;
        }


        .maintenance-brand strong {
            display: block;

            color: #f8fafc;

            font-size: 14px;
        }


        .maintenance-brand span {
            display: block;

            margin-top: 3px;

            color: #71849b;

            font-size: 10px;
        }


        .maintenance-icon {
            width: 50px;
            height: 50px;

            margin-bottom: 20px;

            display: grid;
            place-items: center;

            color: #93c5fd;
            background:
                rgba(37, 99, 235, 0.12);

            border:
                1px solid
                rgba(96, 165, 250, 0.3);

            border-radius: 14px;
        }


        .maintenance-icon svg {
            width: 25px;
            height: 25px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        .eyebrow {
            display: block;

            margin-bottom: 9px;

            color: #60a5fa;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.13em;
        }


        h1 {
            margin: 0;

            color: #ffffff;

            font-size:
                clamp(
                    27px,
                    5vw,
                    36px
                );

            line-height: 1.15;
            letter-spacing: -0.035em;
        }


        .maintenance-information-panel {
            margin-top: 18px;
            padding: 14px 15px;

            background: #09131f;

            border:
                1px solid #293c52;

            border-radius: 11px;
        }


        .maintenance-information-label,
        .estimate > span {
            display: block;

            color: #71849b;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }


        .description {
            margin: 7px 0 0;

            color: #c2cfdd;

            font-size: 13px;
            line-height: 1.65;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }


        .estimate {
            margin-top: 10px;
        }


        .estimate strong {
            display: block;

            margin-top: 6px;

            color: #e5edf7;

            font-size: 13px;
            line-height: 1.5;
        }


        .retry-button {
            width: 100%;
            min-height: 45px;

            margin-top: 22px;
            padding: 10px 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            border:
                1px solid #60a5fa;

            border-radius: 11px;

            font: inherit;
            font-size: 12px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 22px
                rgba(37, 99, 235, 0.22);

            transition:
                transform 150ms ease,
                box-shadow 150ms ease;
        }


        .retry-button:hover:not(:disabled) {
            transform:
                translateY(-1px);

            box-shadow:
                0 11px 26px
                rgba(37, 99, 235, 0.29);
        }


        .retry-button:active:not(:disabled) {
            transform:
                scale(0.985);
        }


        .retry-button:disabled {
            cursor: wait;
            opacity: 0.8;
        }


        .retry-spinner {
            width: 16px;
            height: 16px;

            display: none;

            border:
                2px solid
                rgba(255, 255, 255, 0.35);

            border-top-color: #ffffff;
            border-radius: 50%;

            animation:
                retry-spin
                700ms linear infinite;
        }


        .retry-button.is-loading
        .retry-label {
            display: none;
        }


        .retry-button.is-loading
        .retry-spinner {
            display: block;
        }


        .preview-note {
            margin: 15px 0 0;

            display: none;

            color: #fbbf24;

            font-size: 10px;
            line-height: 1.5;
            text-align: center;
        }


        body.is-preview
        .preview-note {
            display: block;
        }


        @keyframes retry-spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        @media (max-width: 520px) {

            body {
                padding: 15px;
            }


            .maintenance-card {
                padding: 25px 21px;

                border-radius: 16px;
            }


            .maintenance-brand {
                margin-bottom: 25px;
            }

        }

    </style>

</head>


<body>

    <main class="maintenance-card">

        <div class="maintenance-brand">

            <img
                src="/favicon.png"
                alt=""
                aria-hidden="true"
            >

            <div>

                <strong>
                    mrsteve.my.id
                </strong>

                <span>
                    Learning Management System
                </span>

            </div>

        </div>


        <div
            class="maintenance-icon"
            aria-hidden="true"
        >

            <svg viewBox="0 0 24 24">

                <path d="M6 2h12"></path>

                <path d="M6 22h12"></path>

                <path
                    d="M8 2v4.5c0 1.2.5 2.3 1.4 3.1L12 12l-2.6 2.4A4.2 4.2 0 0 0 8 17.5V22"
                ></path>

                <path
                    d="M16 2v4.5c0 1.2-.5 2.3-1.4 3.1L12 12l2.6 2.4a4.2 4.2 0 0 1 1.4 3.1V22"
                ></path>

            </svg>

        </div>


        <small class="eyebrow">
            SYSTEM MAINTENANCE
        </small>


        <h1>
            Website sedang dalam pemeliharaan
        </h1>


        <div class="maintenance-information-panel">

            <span class="maintenance-information-label">
                Alasan
            </span>

            <p
                id="maintenanceReason"
                class="description"
            >
                Kami sedang melakukan pembaruan sistem.
                Silakan coba kembali nanti.
            </p>

        </div>


        <div class="
            estimate
            maintenance-information-panel
        ">

            <span>
                Estimasi selesai
            </span>

            <strong id="maintenanceEstimate">
                Memuat estimasi...
            </strong>

        </div>


        <button
            type="button"
            id="retryButton"
            class="retry-button"
        >

            <span class="retry-label">
                Coba Lagi
            </span>

            <span
                class="retry-spinner"
                aria-hidden="true"
            ></span>

        </button>


        <p class="preview-note">
            Ini hanya preview. Localhost tetap dapat
            digunakan seperti biasa.
        </p>

    </main>


    <script>

        const previewMode =
            new URLSearchParams(
                window.location.search
            ).get("preview") === "1";


        if (previewMode) {

            document.body.classList.add(
                "is-preview"
            );

        }


        const maintenanceReason =
            document.getElementById(
                "maintenanceReason"
            );

        const maintenanceEstimate =
            document.getElementById(
                "maintenanceEstimate"
            );

        const retryButton =
            document.getElementById(
                "retryButton"
            );

        const retryLabel =
            retryButton.querySelector(
                ".retry-label"
            );


        function formatEstimatedTime(
            value
        ) {

            if (!value) {
                return "Belum ditentukan";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return "Belum ditentukan";
            }


            return new Intl.DateTimeFormat(
                "id-ID",
                {
                    weekday:
                        "long",

                    day:
                        "numeric",

                    month:
                        "long",

                    year:
                        "numeric",

                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            ).format(date);

        }


        async function loadMaintenanceStatus(
            redirectWhenFinished = true
        ) {

            const response =
                await fetch(
                    "/api/site-status",
                    {
                        cache:
                            "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Status website gagal diperiksa."
                );

            }


            maintenanceReason.textContent =
                data.reason ||
                "Kami sedang melakukan pembaruan sistem. Silakan coba kembali nanti.";


            maintenanceEstimate.textContent =
                formatEstimatedTime(
                    data.estimatedEndAt
                );


            if (
                redirectWhenFinished &&
                !previewMode &&
                !data.maintenance
            ) {

                window.location.replace(
                    "/index.html"
                );

                return false;

            }


            return true;

        }


        retryButton.addEventListener(
            "click",
            async () => {

                if (
                    retryButton.disabled
                ) {
                    return;
                }


                retryButton.disabled =
                    true;

                retryButton.classList.add(
                    "is-loading"
                );


                try {

                    await Promise.all([

                        loadMaintenanceStatus(
                            true
                        ),

                        new Promise(
                            resolve => {

                                setTimeout(
                                    resolve,
                                    350
                                );

                            }
                        )

                    ]);


                    /*
                        Jika masih maintenance,
                        halaman tidak direload agar
                        isi card tidak berkedip.
                    */


                } catch (error) {

                    console.error(
                        "Status website gagal diperiksa:",
                        error
                    );


                } finally {

                    retryButton.disabled =
                        false;

                    retryButton.classList.remove(
                        "is-loading"
                    );

                }

            }
        );


        loadMaintenanceStatus(
            true
        ).catch(
            error => {

                console.error(
                    "Status maintenance gagal dimuat:",
                    error
                );


                maintenanceEstimate
                    .textContent =
                        "Belum dapat diperiksa";

            }
        );

    </script>

</body>

</html>
