<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifikasi Siswa</title>

    <link
    rel="stylesheet"
    href="/styles.css"
>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .notification {
            border: 1px solid #ccc;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .notification.unread {
            border: 2px solid #2563eb;
            background: #eff6ff;
        }

        .notification:hover {
            background: #f5f5f5;
        }

        .time {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .empty {
            color: #666;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="notification-popup-page">

    <main class="notification-popup-shell">

        <section class="notification-popup-panel">

            <button
                type="button"
                class="notification-close-button"
                onclick="goBack()"
                aria-label="Tutup notifikasi"
            >
                ×
            </button>


            <div class="notification-popup-header">

                <small class="eyebrow">
                    NOTIFICATIONS
                </small>

                <h1>
                    Notifikasi
                </h1>

                <p>
                    Mention, reply, dan aktivitas terbaru
                    dari Classroom Feed.
                </p>

            </div>


            <div
                id="notificationList"
                class="notification-popup-list"
            >
                Memuat notifikasi...
            </div>

        </section>

    </main>

    <script>

        const studentId =
            Number(
                localStorage.getItem(
                    "studentId"
                )
            );

        if (!Number.isInteger(studentId)) {

            window.location.href =
                "/student-login.html";

        }


        function goBack() {

            window.location.href =
                "/student-announcements.html";

        }


        async function loadNotifications() {

            const container =
                document.getElementById(
                    "notificationList"
                );


            try {

                const response =
                    await fetch(
                        `/api/student/${studentId}/notifications`
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    container.innerHTML =
                        "Gagal mengambil notifikasi.";

                    return;

                }


                container.innerHTML = "";


                if (
                    !data.notifications ||
                    data.notifications.length === 0
                ) {

container.innerHTML = `

    <div class="empty-state">

        <strong>
            Belum ada notifikasi
        </strong>

        <span>
            Aktivitas baru akan muncul di sini.
        </span>

    </div>

`;

                    return;

                }


                data.notifications.forEach(
                    (notification) => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "notification";


                        if (
                            notification.is_read === 0
                        ) {

                            item.classList.add(
                                "unread"
                            );

                        }


item.innerHTML = `

    ${
        notification.is_read === 0
            ? `
                <span
                    class="notification-unread-dot"
                    aria-label="Belum dibaca"
                ></span>
            `
            : ""
    }


    <div class="notification-content">

        <p>
            ${escapeHtml(
                notification.message
            )}
        </p>

        <span class="notification-time">
            ${escapeHtml(
                notification.created_at
            )}
        </span>

    </div>


    <span class="notification-arrow">
        →
    </span>

`;


                        item.onclick = () => {

                            openNotification(
                                notification
                            );

                        };


                        container.appendChild(
                            item
                        );

                    }
                );


            } catch (error) {

                console.error(error);

                container.innerHTML =
                    "Terjadi kesalahan saat mengambil notifikasi.";

            }

        }


        async function openNotification(
            notification
        ) {

            try {

                await fetch(
                    `/api/notifications/${notification.id}/read`,
                    {
                        method: "PATCH"
                    }
                );

            } catch (error) {

                console.error(
                    "Gagal menandai notifikasi:",
                    error
                );

            }


   sessionStorage.setItem(
    "notificationAnnouncementId",
    String(
        notification.announcement_id || ""
    )
);

sessionStorage.setItem(
    "notificationReplyId",
    String(
        notification.reply_id || ""
    )
);

window.location.href =
    "/student-announcements.html";

        }


        function escapeHtml(text) {

            return String(text ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function goToDashboard() {

    window.location.href =
        "/student-dashboard.html";

}


function goToPoints() {

    window.location.href =
        "/student-points.html";

}


function goToExamScores() {

    window.location.href =
        "/student-exam-scores.html";

}


function goToClassroomFeed() {

    window.location.href =
        "/student-announcements.html";

}


async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.error(error);

    }


    localStorage.removeItem(
        "studentId"
    );

    localStorage.removeItem(
        "studentName"
    );

    localStorage.removeItem(
        "studentClass"
    );

    localStorage.removeItem(
        "studentLoginCode"
    );


    window.location.href =
        "/student-login.html";
}


        loadNotifications();

    </script>

</body>
</html>
