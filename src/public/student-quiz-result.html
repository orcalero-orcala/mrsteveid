<!DOCTYPE html>
<html
    lang="id"
    class="lms-page-is-loading"
    style="background-color: #080e17;"
>

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style id="lmsPageLoaderCriticalStyles">

    /*
     * Warna ini langsung tersedia dari HTML.
     * Tidak perlu menunggu styles.css.
     */
    html,
    body {
        background-color:
            #080e17;
    }


    html.lms-page-is-loading,
    html.lms-page-is-loading body {
        overflow:
            hidden;
    }


    .lms-page-loader {
        position:
            fixed;

        inset:
            0;

        z-index:
            2147483647;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        background:
            #080e17;

        opacity:
            0;

        visibility:
            hidden;

        pointer-events:
            none;
    }


    .lms-page-loader.is-visible {
        opacity:
            1;

        visibility:
            visible;

        pointer-events:
            all;
    }


    .lms-page-loader[hidden] {
        display:
            none !important;
    }


    .lms-page-loader-content {
        display:
            flex;

        flex-direction:
            column;

        align-items:
            center;

        justify-content:
            center;

        gap:
            13px;

        color:
            #8ea4bd;
    }


    .lms-page-loader-spinner {
        width:
            30px;

        height:
            30px;

        border:
            3px solid
            rgba(96, 165, 250, 0.18);

        border-top-color:
            #60a5fa;

        border-radius:
            50%;

        animation:
            lms-critical-loader-spin
            700ms
            linear
            infinite;
    }


    .lms-page-loader-text {
        color:
            #8ea4bd;

        font-family:
            Arial,
            sans-serif;

        font-size:
            11px;

        font-weight:
            700;

        line-height:
            1.3;
    }


    @keyframes lms-critical-loader-spin {

        to {
            transform:
                rotate(360deg);
        }

    }

</style>

    <title data-i18n="studentQuizResult.pageTitle">
        Hasil Quiz
    </title>

        <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
>

    <link
        rel="stylesheet"
        href="/styles.css"
    >
<script
    src="/image-guard.js"
    defer
></script>

<script
    src="/image-viewer.js"
    defer
></script>

<script
    src="/page-loader.js"
    defer
></script>

<script
    src="/language.js?v=20260913-10"
    defer
></script>

</head>

<body class="student-result-body">

<div
    id="lmsPageLoader"
    class="lms-page-loader is-visible"
    role="status"
    aria-live="polite"
    aria-label="Halaman sedang dimuat"
    data-i18n-aria-label="studentQuizResult.loadingPage"
>
    <div class="lms-page-loader-content">

        <span
            class="lms-page-loader-spinner"
            aria-hidden="true"
        ></span>

        <span class="lms-page-loader-text">
            Loading...
        </span>

    </div>
</div>

    <main class="student-result-shell">

        <div
            id="resultContent"
            class="student-result-loading"
            data-i18n="studentQuizResult.loadingResult"
        >
            Memuat hasil Quiz...
        </div>

    </main>


    <script>

        function studentQuizResultText(
            key,
            variables = {}
        ) {

            if (
                window.LMSLanguage &&
                typeof window.LMSLanguage.t ===
                    "function"
            ) {

                return window.LMSLanguage.t(
                    `studentQuizResult.${key}`,
                    variables
                );

            }


            return key;

        }


        function getStudentQuizResultLanguage() {

            if (
                window.LMSLanguage &&
                typeof window.LMSLanguage
                    .getLanguage === "function"
            ) {

                return window.LMSLanguage
                    .getLanguage();

            }


            return "id";

        }

        const resultContent =
            document.getElementById(
                "resultContent"
            );

        const resultParameters =
            new URLSearchParams(
                window.location.search
            );


        const previousResultState =
            window.history.state ||
            {};


        const attemptId =
            Number(
                resultParameters.get(
                    "attemptId"
                ) ||
                previousResultState.attemptId
            );


        let reviewMode =
            resultParameters.get(
                "review"
            ) === "1" ||
            previousResultState.reviewMode === true;


        let currentAttempt =
            null;


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            ).replace(
                /[&<>"']/g,
                (
                    character
                ) => {

                    return {
                        "&":
                            "&amp;",

                        "<":
                            "&lt;",

                        ">":
                            "&gt;",

                        "\"":
                            "&quot;",

                        "'":
                            "&#39;"
                    }[character];

                }
            );

        }


        function parseServerDate(
            value
        ) {

            if (!value) {

                return null;

            }


            const source =
                String(
                    value
                );


            /*
                Timestamp SQLite yang tidak mempunyai
                timezone dianggap UTC.
            */
            const normalizedValue =
                /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/
                    .test(
                        source
                    )

                    ? source.replace(
                        " ",
                        "T"
                    ) + "Z"

                    : source;


            const parsedDate =
                new Date(
                    normalizedValue
                );


            return Number.isNaN(
                parsedDate.getTime()
            )
                ? null
                : parsedDate;

        }


        function formatDateTime(
            value
        ) {

            const parsedDate =
                parseServerDate(
                    value
                );


            if (!parsedDate) {

                return "-";

            }


            return new Intl.DateTimeFormat(
                getStudentQuizResultLanguage(),
                {
                    dateStyle:
                        "long",

                    timeStyle:
                        "short"
                }
            ).format(
                parsedDate
            );

        }


        function goToQuizDashboard() {

            window.location.href =
                "/student-quizzes.html";

        }


        function showSummary() {

            reviewMode =
                false;


            window.history.replaceState(
                {
                    attemptId:
                        currentAttempt.id,

                    reviewMode:
                        false
                },
                "",
                "/student-quiz-result.html"
            );


            renderSummary();


            window.scrollTo({
                top:
                    0,

                behavior:
                    "smooth"
            });

        }


        function showReview() {

            reviewMode =
                true;


            window.history.replaceState(
                {
                    attemptId:
                        currentAttempt.id,

                    reviewMode:
                        true
                },
                "",
                "/student-quiz-result.html"
            );


            renderReview();


            window.scrollTo({
                top:
                    0,

                behavior:
                    "smooth"
            });

        }


        function renderSummary() {

            const attempt =
                currentAttempt;

            const resultHasEssayQuestions =
    Array.isArray(attempt.answers) &&
    attempt.answers.some(
        answer =>
            answer.type === "essay"
    );


const resultHasAutoGradedQuestions =
    Number(
        attempt.totalQuestions || 0
    ) > 0;


let resultScoreNote;


if (
    resultHasEssayQuestions &&
    !resultHasAutoGradedQuestions
) {

    resultScoreNote =
        studentQuizResultText(
            "essayOnlyScoreNote"
        );

} else if (
    resultHasEssayQuestions
) {

    resultScoreNote =
        studentQuizResultText(
            "mixedScoreNote"
        );

} else {

    resultScoreNote =
        studentQuizResultText(
            "autoGradeScoreNote"
        );

}

                        const hasAutoGradedQuestions =
                Number(
                    attempt.totalQuestions ||
                    0
                ) >
                0;


            resultContent.className =
                "student-result-content";


            resultContent.innerHTML =
                `
                    <section class="student-result-summary">

                        <div class="student-result-eyebrow">
                            QUIZ COMPLETED
                        </div>

                        <h1>
                            ${escapeHtml(
                                attempt.title
                            )}
                        </h1>

                        <p class="student-result-subtitle">

                            ${
                                hasAutoGradedQuestions

                                    ? `
                                        ${escapeHtml(
                                            studentQuizResultText(
                                                "autoGradedSubtitle"
                                            )
                                        )}
                                    `

                                    : `
                                        ${escapeHtml(
                                            studentQuizResultText(
                                                "essaySubmittedSubtitle"
                                            )
                                        )}
                                    `
                            }

                        </p>


                        <div class="
                            student-result-score-block

                            ${
                                hasAutoGradedQuestions
                                    ? ""
                                    : "no-autograde"
                            }
                        ">

                            <span class="student-result-score-label">

                                ${
                                    hasAutoGradedQuestions
                                        ? studentQuizResultText(
                                            "scoreLabel"
                                        )
                                        : studentQuizResultText(
                                            "resultLabel"
                                        )
                                }

                            </span>

                            <strong class="student-result-score">

                                ${
                                    hasAutoGradedQuestions
                                        ? attempt.score
                                        : "N/A"
                                }

                            </strong>

                            <span class="student-result-score-maximum">

                                ${
                                    hasAutoGradedQuestions
                                        ? "/ 100"
                                        : escapeHtml(
                                            studentQuizResultText(
                                                "notAutoGraded"
                                            )
                                        )
                                }

                            </span>

                        </div>


                        <p class="student-result-score-note">
                            ${escapeHtml(resultScoreNote)}
                        </p>


<div class="student-result-formula">

    <strong>

        ${
            hasAutoGradedQuestions

                ? `
                    ${escapeHtml(
                        studentQuizResultText(
                            "correctFormula",
                            {
                                correct:
                                    attempt.correctCount,

                                total:
                                    attempt.totalQuestions
                            }
                        )
                    )}
                `

                : `
                    ${escapeHtml(
                        studentQuizResultText(
                            "essayOnlyQuiz"
                        )
                    )}
                `
        }

    </strong>

</div>


                        <div class="student-result-information">

                            <div>

                                <span>${escapeHtml(
                                    studentQuizResultText(
                                        "subject"
                                    )
                                )}</span>

                                <strong>
                                    ${escapeHtml(
                                        attempt.subject ||
                                        studentQuizResultText(
                                            "noSubject"
                                        )
                                    )}
                                </strong>

                            </div>

                            <div>

                                <span>${escapeHtml(
                                    studentQuizResultText(
                                        "material"
                                    )
                                )}</span>

                                <strong>
                                    ${escapeHtml(
                                        attempt.material ||
                                        studentQuizResultText(
                                            "noMaterial"
                                        )
                                    )}
                                </strong>

                            </div>

                            <div>

                                <span>${escapeHtml(
                                    studentQuizResultText(
                                        "submitted"
                                    )
                                )}</span>

                                <strong>
                                    ${escapeHtml(
                                        formatDateTime(
                                            attempt.submittedAt
                                        )
                                    )}
                                </strong>

                            </div>

                        </div>


                        <div class="student-result-actions">

                            <button
                                type="button"
                                class="student-result-primary-button"
                                onclick="showReview()"
                            >
                                ${escapeHtml(
                                    studentQuizResultText(
                                        "viewQuiz"
                                    )
                                )}
                            </button>

                            <button
                                type="button"
                                class="student-result-secondary-button"
                                onclick="goToQuizDashboard()"
                            >
                                ${escapeHtml(
                                    studentQuizResultText(
                                        "backToQuizDashboard"
                                    )
                                )}
                            </button>

                        </div>

                    </section>
                `;

        }


        function renderAnswerCard(
            answer,
            answerIndex
        ) {

            const isEssay =
                answer.type ===
                "essay";


            /*
                Essay tidak diberi status benar
                maupun salah karena tidak dinilai
                otomatis.
            */
            const statusClass =
                isEssay
                    ? "essay"
                    : answer.isCorrect
                        ? "correct"
                        : "incorrect";


            const statusText =
                isEssay
                    ? studentQuizResultText(
                        "essayAnswer"
                    )
                    : answer.isCorrect
                        ? studentQuizResultText(
                            "correct"
                        )
                        : studentQuizResultText(
                            "incorrect"
                        );


            const questionType =
                answer.type ===
                "mcq"

                    ? studentQuizResultText(
                        "multipleChoice"
                    )

                    : answer.type ===
                        "essay"

                        ? studentQuizResultText(
                            "essay"
                        )
                        : studentQuizResultText(
                            "shortAnswer"
                        );


            /*
                Kunci jawaban hanya ditampilkan
                untuk jawaban autograde yang salah.

                Essay tidak mempunyai kunci jawaban.
            */
            const correctAnswerSection =
                isEssay ||
                answer.isCorrect

                    ? ""

                    : `
                        <div class="student-review-answer correct-answer">

                            <span>
                                ${escapeHtml(
                                    studentQuizResultText(
                                        "correctAnswer"
                                    )
                                )}
                            </span>

                            <strong>
                                ${escapeHtml(
                                    answer.correctAnswer
                                )}
                            </strong>

                        </div>
                    `;


            return `
                <article
                    class="student-review-card ${statusClass}"
                >

                    <div class="student-review-card-header">

                        <span class="student-review-number">
                            ${escapeHtml(
                                studentQuizResultText(
                                    "questionNumber",
                                    {
                                        number:
                                            answerIndex + 1
                                    }
                                )
                            )}
                        </span>

                        <span class="student-review-type">
                            ${questionType}
                        </span>

                        <span
                            class="student-review-status ${statusClass}"
                        >
                            ${statusText}
                        </span>

                    </div>


${
    String(
        answer.text || ""
    ).trim()

        ? `
            <h3>
                ${escapeHtml(
                    answer.text
                )}
            </h3>
        `

        : ""
}

${
    answer.imageUrl

        ? `
            <div class="student-review-question-image">
                <img
                    src="${escapeHtml(
                        answer.imageUrl
                    )}"
                    alt="${escapeHtml(
                        studentQuizResultText(
                            "questionImageAlt",
                            {
                                number:
                                    answerIndex + 1
                            }
                        )
                    )}"
                    loading="lazy"
                    decoding="async"
                    referrerpolicy="no-referrer"
                    onerror="
                        this.hidden = true;
                        this.nextElementSibling.hidden = false;
                    "
                >

                <p hidden>
                    ${escapeHtml(
                        studentQuizResultText(
                            "imageLoadFailed"
                        )
                    )}
                </p>
            </div>
        `

        : ""
}


                    <div class="student-review-answer">

                        <span>
                            ${escapeHtml(
                                studentQuizResultText(
                                    "yourAnswer"
                                )
                            )}
                        </span>

                        <strong>${escapeHtml(
                            answer.studentAnswer
                        )}</strong>

                    </div>


                    ${correctAnswerSection}

                </article>
            `;

        }


        function renderReview() {

            const attempt =
                currentAttempt;

                        const hasAutoGradedQuestions =
                Number(
                    attempt.totalQuestions ||
                    0
                ) >
                0;


            const answers =
                Array.isArray(
                    attempt.answers
                )
                    ? attempt.answers
                    : [];


            resultContent.className =
                "student-result-content";


            resultContent.innerHTML =
                `
                    <section class="student-review-header">

                        <div>

                            <span class="student-result-eyebrow">
                                ANSWER REVIEW
                            </span>

                            <h1>
                                ${escapeHtml(
                                    attempt.title
                                )}
                            </h1>

                            <p>
                                ${escapeHtml(
                                    studentQuizResultText(
                                        "reviewDescription"
                                    )
                                )}
                            </p>

                        </div>


                        <div class="student-review-score">

                            <span>${escapeHtml(
                                studentQuizResultText(
                                    "grade"
                                )
                            )}</span>

                            <strong>

                                ${
                                    hasAutoGradedQuestions
                                        ? attempt.score
                                        : "—"
                                }

                            </strong>

                            <small>

                                ${
                                    hasAutoGradedQuestions

                                        ? `
                                            ${escapeHtml(
                                                studentQuizResultText(
                                                    "correctCount",
                                                    {
                                                        correct:
                                                            attempt.correctCount,

                                                        total:
                                                            attempt.totalQuestions
                                                    }
                                                )
                                            )}
                                        `

                                        : `
                                            ${escapeHtml(
                                                studentQuizResultText(
                                                    "notAutoGraded"
                                                )
                                            )}
                                        `
                                }

                            </small>

                        </div>

                    </section>


                    <section class="student-review-list">

                        ${
                            answers.length

                                ? answers.map(
                                    renderAnswerCard
                                ).join(
                                    ""
                                )

                                : `
                                    <div class="student-result-empty">
                                        ${escapeHtml(
                                            studentQuizResultText(
                                                "answerDetailsUnavailable"
                                            )
                                        )}
                                    </div>
                                `
                        }

                    </section>


                    <div class="student-result-bottom-actions">

                        <button
                            type="button"
                            class="student-result-secondary-button"
                            onclick="showSummary()"
                        >
                            ${escapeHtml(
                                studentQuizResultText(
                                    "viewScoreSummary"
                                )
                            )}
                        </button>

                        <button
                            type="button"
                            class="student-result-primary-button"
                            onclick="goToQuizDashboard()"
                        >
                            ${escapeHtml(
                                studentQuizResultText(
                                    "backToQuizDashboard"
                                )
                            )}
                        </button>

                    </div>
                `;

        }


        function renderResult() {

            if (reviewMode) {

                renderReview();

            } else {

                renderSummary();

            }

        }


        function showLoadError(
            message
        ) {

            resultContent.className =
                "student-result-error";


            resultContent.innerHTML =
                `
                    <h2>
                        ${escapeHtml(
                            studentQuizResultText(
                                "resultCannotOpen"
                            )
                        )}
                    </h2>

                    <p>
                        ${escapeHtml(
                            message
                        )}
                    </p>

                    <button
                        type="button"
                        class="student-result-secondary-button"
                        onclick="goToQuizDashboard()"
                    >
                        ${escapeHtml(
                            studentQuizResultText(
                                "backToQuizDashboard"
                            )
                        )}
                    </button>
                `;

        }


        async function loadResult() {

            if (
                !Number.isInteger(
                    attemptId
                ) ||
                attemptId <= 0
            ) {

                showLoadError(
                    studentQuizResultText(
                        "resultIdMissing"
                    )
                );


                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/student/quiz-attempts/${attemptId}`
                    );


                const data =
                    await response.json();


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/index.html";


                    return;

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        studentQuizResultText(
                            "fetchFailed"
                        )
                    );

                }


                currentAttempt =
                    data.attempt;


                document.title =
                    studentQuizResultText(
                        "documentTitle",
                        {
                            title:
                                currentAttempt.title
                        }
                    );


                /*
                    Hilangkan attemptId dan review dari URL
                    setelah datanya berhasil diambil.
                */
                window.history.replaceState(
                    {
                        attemptId:
                            currentAttempt.id,

                        reviewMode
                    },
                    "",
                    "/student-quiz-result.html"
                );


                renderResult();

            } catch (
                error
            ) {

                showLoadError(
                    error.message
                );

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            loadResult,
            {
                once: true
            }
        );

    </script>

</body>

</html>
