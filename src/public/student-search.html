<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Student Search</title>

    <link
        rel="icon"
        type="image/png"
        href="/favicon.png"
    >

    <link
        rel="stylesheet"
        href="/styles.css"
    >

    <script src="/student-profile-initial.js"></script>

    <style>
        :root {
            --directory-bg: #0b121d;
            --directory-panel: #111b28;
            --directory-inner: #0d1724;
            --directory-border: #293c52;
            --directory-muted: #86a1c2;
            --directory-blue: #3b82f6;
        }

        .student-directory-page {
            min-height: 100vh;
            color: #ffffff;
            background: var(--directory-bg);
        }

        .student-directory-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            min-height: 68px;
            padding: 0 28px;

            border-bottom:
                1px solid
                var(--directory-border);

            background: #0b1421;
        }

        .student-directory-header-left,
        .student-directory-user {
            display: flex;
            align-items: center;
        }

        .student-directory-header-left {
            gap: 13px;
        }

        .student-directory-back {
            display: grid;
            place-items: center;

            width: 38px;
            height: 38px;

            border:
                1px solid
                var(--directory-border);

            border-radius: 10px;

            color: #a9c2df;
            background: #101b29;

            cursor: pointer;
        }

        .student-directory-back svg {
            width: 18px;
            height: 18px;

            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .student-directory-title h2,
        .student-directory-title p {
            margin: 0;
        }

        .student-directory-title h2 {
            font-size: 19px;
        }

        .student-directory-title p {
            margin-top: 3px;
            color: var(--directory-muted);
            font-size: 12px;
        }

        .student-directory-user {
            gap: 9px;
            font-size: 13px;
            font-weight: 700;
        }

        .student-directory-user-avatar,
        .student-result-avatar,
        .public-profile-avatar {
            display: grid;
            place-items: center;
            overflow: hidden;

            border-radius: 50%;

            color: #ffffff;
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #1d4ed8
                );

            font-weight: 800;
        }

        .student-directory-user-avatar {
            width: 36px;
            height: 36px;
        }

        .student-directory-user-avatar img,
        .student-result-avatar img,
        .public-profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-directory-main {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 48px 24px 70px;
        }

        .student-directory-intro {
            text-align: center;
        }

        .student-directory-intro span {
            color: #60a5fa;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.17em;
        }

        .student-directory-intro h1 {
            margin: 12px 0 9px;
            font-size: clamp(32px, 6vw, 52px);
        }

        .student-directory-intro p {
            margin: 0;
            color: var(--directory-muted);
        }

        .student-directory-form {
            display: flex;
            gap: 10px;

            width: min(740px, 100%);
            margin: 28px auto 0;
        }

        .student-directory-input-wrap {
            position: relative;
            flex: 1;
        }

        .student-directory-input-wrap svg {
            position: absolute;
            top: 50%;
            left: 18px;

            width: 20px;
            height: 20px;

            fill: none;
            stroke: #7896b9;
            stroke-width: 2;

            transform: translateY(-50%);
        }

        .student-directory-input {
            width: 100%;
            min-height: 54px;
            padding: 0 18px 0 50px;

            border:
                1px solid
                var(--directory-border);

            border-radius: 14px;

            color: #ffffff;
            background: #0d1724;

            font: inherit;
            font-size: 15px;
            outline: none;
        }

        .student-directory-input:focus {
            border-color: var(--directory-blue);

            box-shadow:
                0 0 0 4px
                rgba(59, 130, 246, 0.14);
        }

        .student-directory-submit {
            padding: 0 24px;

            border: 0;
            border-radius: 14px;

            color: #ffffff;
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .student-directory-status {
            min-height: 22px;
            margin: 19px 0 0;

            color: var(--directory-muted);
            text-align: center;
            font-size: 13px;
        }

        .student-directory-results {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px, 1fr)
                );

            gap: 13px;
            margin-top: 17px;
        }

        .student-result-card {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;

            border:
                1px solid
                var(--directory-border);

            border-radius: 15px;

            color: inherit;
            text-align: left;
            background: var(--directory-panel);

            cursor: pointer;

            animation:
                studentResultIn 0.26s ease both;

            transition:
                transform 0.18s ease,
                border-color 0.18s ease;
        }

        .student-result-card:hover {
            transform: translateY(-2px);
            border-color: #4876a7;
        }

        .student-result-avatar {
            flex: 0 0 auto;

            width: 48px;
            height: 48px;
        }

        .student-result-text {
            min-width: 0;
        }

        .student-result-text strong {
            display: block;
            overflow: hidden;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-result-text span {
            display: block;
            margin-top: 4px;

            color: var(--directory-muted);
            font-size: 12px;
        }

        .public-profile {
            display: none;
            overflow: hidden;

            margin-top: 28px;

            border:
                1px solid
                var(--directory-border);

            border-radius: 21px;

            background: var(--directory-panel);

            animation:
                publicProfileIn 0.3s ease both;
        }

        .public-profile.is-visible {
            display: block;
        }

        .public-profile-banner {
            position: relative;
            height: 145px;
        }

        .public-profile-banner::after {
            content: "";

            position: absolute;
            top: -75px;
            right: 7%;

            width: 230px;
            height: 230px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 50%;
        }

        .public-profile-body {
            position: relative;
            padding: 78px 28px 28px;
        }

        .public-profile-avatar {
            position: absolute;
            top: -68px;
            left: 28px;

            width: 128px;
            height: 128px;

            border: 6px solid var(--directory-panel);

            font-size: 44px;
        }

        .public-profile-name {
            margin: 0;
            font-size: 30px;
        }

        .public-profile-meta,
        .public-profile-bio {
            color: var(--directory-muted);
        }

        .public-profile-meta {
            margin-top: 6px;
            font-size: 13px;
        }

        .public-profile-bio {
            min-height: 20px;
            margin-top: 16px;
            white-space: pre-line;
        }

        .public-profile-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 12px;
            margin-top: 24px;
        }

        .public-profile-item {
            padding: 16px;

            border:
                1px solid
                var(--directory-border);

            border-radius: 13px;

            background: var(--directory-inner);
        }

        .public-profile-item small {
            display: block;
            margin-bottom: 7px;

            color: #7693b5;
        }

        .public-profile-item strong {
            overflow-wrap: anywhere;
        }

        .public-profile-item.is-private strong {
            color: #70859f;
            letter-spacing: 0.12em;
        }

        .privacy-note {
            display: none;

            margin-top: 13px;
            padding: 12px 14px;

            border:
                1px solid
                rgba(245, 158, 11, 0.27);

            border-radius: 11px;

            color: #d5af67;
            background:
                rgba(245, 158, 11, 0.07);

            font-size: 12px;
        }

        .privacy-note.is-visible {
            display: block;
        }

        @keyframes studentResultIn {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes publicProfileIn {
            from {
                opacity: 0;
                transform: translateY(11px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            .student-directory-header {
                padding: 0 15px;
            }

            .student-directory-main {
                padding:
                    36px 15px
                    50px;
            }

            .student-directory-form {
                flex-direction: column;
            }

            .student-directory-submit {
                min-height: 48px;
            }

            .public-profile-grid {
                grid-template-columns: 1fr;
            }

            .public-profile-body {
                padding:
                    70px 18px
                    20px;
            }

            .public-profile-avatar {
                left: 18px;
                width: 112px;
                height: 112px;
            }

            .student-directory-user span {
                display: none;
            }
        }
    </style>
</head>

<body class="student-directory-page">

<header class="student-directory-header">

    <div class="student-directory-header-left">

        <button
            type="button"
            class="student-directory-back"
            onclick="
                window.location.href =
                    '/student-profile.html'
            "
            aria-label="Kembali ke Profile"
        >
            <svg viewBox="0 0 24 24">
                <path d="m15 18-6-6 6-6"></path>
            </svg>
        </button>

        <div class="student-directory-title">
            <h2>Student Search</h2>
            <p>Direktori siswa</p>
        </div>

    </div>


    <div class="student-directory-user">

        <div
            class="student-directory-user-avatar"
            id="directoryViewerAvatar"
        >
            S
        </div>

        <span id="directoryViewerName">
            Student
        </span>

    </div>

</header>


<main class="student-directory-main">

    <section class="student-directory-intro">

        <span>STUDENT DIRECTORY</span>

        <h1>Cari teman sekolahmu</h1>

        <p>
            Cari siswa berdasarkan nama atau kelas.
        </p>


        <form
            class="student-directory-form"
            id="studentDirectoryForm"
        >

            <div class="student-directory-input-wrap">

                <svg viewBox="0 0 24 24">
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <path
                        d="m20 20-3.7-3.7"
                    ></path>
                </svg>

                <input
                    type="search"
                    class="student-directory-input"
                    id="studentDirectoryInput"
                    maxlength="80"
                    autocomplete="off"
                    placeholder="Cari nama atau kelas..."
                >

            </div>

            <button
                type="submit"
                class="student-directory-submit"
            >
                Cari
            </button>

        </form>

    </section>


    <p
        class="student-directory-status"
        id="studentDirectoryStatus"
    >
        Ketik minimal 2 karakter untuk mulai mencari.
    </p>


    <section
        class="student-directory-results"
        id="studentDirectoryResults"
    ></section>


    <section
        class="public-profile"
        id="publicStudentProfile"
    >

        <div
            class="public-profile-banner"
            id="publicProfileBanner"
        ></div>

        <div class="public-profile-body">

            <div
                class="public-profile-avatar"
                id="publicProfileAvatar"
            >
                S
            </div>

            <h2
                class="public-profile-name"
                id="publicProfileName"
            >
                Student
            </h2>

            <div
                class="public-profile-meta"
                id="publicProfileMeta"
            ></div>

            <div
                class="public-profile-bio"
                id="publicProfileBio"
            ></div>

            <div
                class="public-profile-grid"
                id="publicProfileGrid"
            ></div>

            <div
                class="privacy-note"
                id="publicProfilePrivacyNote"
            >
                Pemilik profil menyembunyikan statistik akademiknya.
            </div>

        </div>

    </section>

</main>


<script>
    const PROFILE_BACKGROUNDS = {
        blue:
            "linear-gradient(120deg,#173d68,#122b4a 52%,#101d30)",

        purple:
            "linear-gradient(120deg,#4c1d95,#312e81 55%,#17152d)",

        green:
            "linear-gradient(120deg,#065f46,#064e3b 55%,#10251f)",

        orange:
            "linear-gradient(120deg,#9a3412,#7c2d12 55%,#2b1912)",

        red:
            "linear-gradient(120deg,#991b1b,#7f1d1d 55%,#2c1519)"
    };


    const searchForm =
        document.getElementById(
            "studentDirectoryForm"
        );

    const searchInput =
        document.getElementById(
            "studentDirectoryInput"
        );

    const searchStatus =
        document.getElementById(
            "studentDirectoryStatus"
        );

    const searchResults =
        document.getElementById(
            "studentDirectoryResults"
        );

    const publicProfile =
        document.getElementById(
            "publicStudentProfile"
        );


    let searchTimer =
        null;

    let requestController =
        null;


    function getInitial(name) {

        return (
            String(name || "S")
                .trim()
                .charAt(0) ||
            "S"
        ).toUpperCase();

    }


    function renderAvatar(
        element,
        url,
        name
    ) {

        element.textContent =
            getInitial(name);


        const cleanUrl =
            String(url || "").trim();


        if (!cleanUrl) {
            return;
        }


        const image =
            document.createElement("img");


        image.alt =
            `Foto profil ${name}`;

        image.loading =
            "lazy";

        image.src =
            cleanUrl;


        image.addEventListener(
            "error",
            () => image.remove()
        );


        element.textContent =
            "";

        element.appendChild(
            image
        );

    }


    function createSearchCard(student) {

        const button =
            document.createElement("button");

        button.type =
            "button";

        button.className =
            "student-result-card";


        const avatar =
            document.createElement("div");

        avatar.className =
            "student-result-avatar";


        renderAvatar(
            avatar,
            student.profilePictureUrl,
            student.name
        );


        const text =
            document.createElement("div");

        text.className =
            "student-result-text";


        const name =
            document.createElement("strong");

        name.textContent =
            student.fullName ||
            student.name;


        const meta =
            document.createElement("span");

        meta.textContent =
            `${student.className || "-"} · ${student.name || "-"}`;


        text.append(
            name,
            meta
        );


        button.append(
            avatar,
            text
        );


        button.addEventListener(
            "click",
            () => loadPublicProfile(
                student.id
            )
        );


        return button;

    }


    async function searchStudents() {

        const query =
            searchInput.value.trim();


        publicProfile.classList.remove(
            "is-visible"
        );


        if (query.length < 2) {

            searchResults.replaceChildren();

            searchStatus.textContent =
                "Ketik minimal 2 karakter untuk mulai mencari.";

            return;

        }


        if (requestController) {
            requestController.abort();
        }


        requestController =
            new AbortController();


        searchStatus.textContent =
            "Mencari siswa...";


        try {

            const response =
                await fetch(
                    `/api/student/search?q=${
                        encodeURIComponent(query)
                    }`,
                    {
                        signal:
                            requestController.signal
                    }
                );


            const data =
                await response.json();


            if (response.status === 401) {

                window.location.href =
                    "/student-login.html";

                return;

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Pencarian gagal."
                );

            }


            searchResults.replaceChildren();


            if (!data.students.length) {

                searchStatus.textContent =
                    "Tidak ada siswa yang cocok.";

                return;

            }


            const fragment =
                document.createDocumentFragment();


            data.students.forEach(
                student => {

                    fragment.appendChild(
                        createSearchCard(
                            student
                        )
                    );

                }
            );


            searchResults.appendChild(
                fragment
            );


            searchStatus.textContent =
                `${data.students.length} siswa ditemukan.`;

        } catch (error) {

            if (error.name === "AbortError") {
                return;
            }


            console.error(error);

            searchStatus.textContent =
                error.message ||
                "Pencarian tidak dapat dimuat.";

        }

    }


    function createProfileItem(
        label,
        value,
        isPrivate = false
    ) {

        const item =
            document.createElement("div");

        item.className =
            "public-profile-item";


        if (isPrivate) {

            item.classList.add(
                "is-private"
            );

        }


        const small =
            document.createElement("small");

        small.textContent =
            label;


        const strong =
            document.createElement("strong");

        strong.textContent =
            value;


        item.append(
            small,
            strong
        );


        return item;

    }


    async function loadPublicProfile(
        studentId
    ) {

        searchStatus.textContent =
            "Memuat profil...";


        try {

            const response =
                await fetch(
                    `/api/student/profiles/${
                        encodeURIComponent(studentId)
                    }`
                );


            const data =
                await response.json();


            if (response.status === 401) {

                window.location.href =
                    "/student-login.html";

                return;

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Profil tidak dapat dimuat."
                );

            }


            const student =
                data.student;


            document.getElementById(
                "publicProfileBanner"
            ).style.background =
                PROFILE_BACKGROUNDS[
                    student.bannerColor
                ] ||
                PROFILE_BACKGROUNDS.blue;


            renderAvatar(
                document.getElementById(
                    "publicProfileAvatar"
                ),
                student.profilePictureUrl,
                student.name
            );


            document.getElementById(
                "publicProfileName"
            ).textContent =
                student.fullName ||
                student.name;


            document.getElementById(
                "publicProfileMeta"
            ).textContent =
                `${student.className || "-"} · Akun siswa`;


            document.getElementById(
                "publicProfileBio"
            ).textContent =
                student.bio ||
                "Belum ada bio.";


            const showStats =
                Boolean(
                    student.showAcademicStats
                );


            const grid =
                document.getElementById(
                    "publicProfileGrid"
                );


            grid.replaceChildren(

                createProfileItem(
                    "Nama Pendek",
                    student.name || "-"
                ),

                createProfileItem(
                    "Kelas",
                    student.className || "-"
                ),

                createProfileItem(
                    "Kode Siswa",
                    "******",
                    true
                ),

                createProfileItem(
                    "Tanggal Lahir",
                    "********",
                    true
                ),

                createProfileItem(
                    "Total Poin",
                    showStats
                        ? String(
                            student.totalPoints ?? 0
                        )
                        : "**",
                    !showStats
                ),

                createProfileItem(
                    "Nilai Rata-rata",
                    showStats
                        ? (
                            student.averageScore ??
                            "Belum ada nilai"
                        )
                        : "**",
                    !showStats
                )

            );


            document.getElementById(
                "publicProfilePrivacyNote"
            ).classList.toggle(
                "is-visible",
                !showStats
            );


            publicProfile.classList.add(
                "is-visible"
            );


            searchStatus.textContent =
                `Profil ${student.name} berhasil dimuat.`;


            publicProfile.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        } catch (error) {

            console.error(error);

            searchStatus.textContent =
                error.message ||
                "Profil tidak dapat dimuat.";

        }

    }


    async function loadViewerProfile() {

        try {

            const response =
                await fetch(
                    "/api/student/profile"
                );


            const data =
                await response.json();


            if (response.status === 401) {

                window.location.href =
                    "/student-login.html";

                return;

            }


            if (
                !response.ok ||
                !data.success
            ) {
                return;
            }


            const student =
                data.student;


            document.getElementById(
                "directoryViewerName"
            ).textContent =
                student.name ||
                "Student";


            renderAvatar(
                document.getElementById(
                    "directoryViewerAvatar"
                ),
                student.profilePictureUrl,
                student.name
            );

        } catch (error) {

            console.error(
                "Gagal memuat profil pengguna:",
                error
            );

        }

    }


    searchForm.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            clearTimeout(
                searchTimer
            );

            searchStudents();

        }
    );


    searchInput.addEventListener(
        "input",
        () => {

            clearTimeout(
                searchTimer
            );


            searchTimer =
                setTimeout(
                    searchStudents,
                    300
                );

        }
    );


    loadViewerProfile();

    searchInput.focus();
</script>

</body>
</html>
